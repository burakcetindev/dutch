name: dutch-vocab

services:
  db:
    image: postgres:16-alpine
    container_name: dutch-vocab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dutch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dutch_password}
      POSTGRES_DB: ${POSTGRES_DB:-dutch_vocabulary}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dutch_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vocab:
    image: node:20-alpine
    container_name: dutch-vocab-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dutch_user}:${POSTGRES_PASSWORD:-dutch_password}@db:5432/${POSTGRES_DB:-dutch_vocabulary}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../input:/app/input
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Starting application...' &&
        node server.js
      "

volumes:
  postgres_data:
    driver: local
